name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360   # GitHub's maximum is 6 hours

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 0 -Force

          # Remove old rule, then allow RDP only from the Tailscale network
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

          Restart-Service -Name TermService -Force

      - name: Set Philippines Region Settings (Manila)
        run: |
          # Time zone: UTC+8 (Windows uses this ID for Manila)
          Set-TimeZone -Id "Singapore Standard Time"

          # Home location: Philippines (GeoId 201)
          Set-WinHomeLocation -GeoId 201

          # Language and regional format: English (Philippines)
          Set-Culture -CultureInfo en-PH
          Set-WinSystemLocale -SystemLocale en-PH
          Set-WinUserLanguageList -LanguageList en-PH -Force

          # Copy these settings to the welcome screen and to new users (the RDP user)
          Copy-UserInternationalSettingsToSystem -WelcomeScreen $true -NewUser $true

          # Allow location access for apps
          $loc = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\location"
          New-Item -Path $loc -Force | Out-Null
          Set-ItemProperty -Path $loc -Name "Value" -Value "Allow"

          Write-Host "Timezone: $((Get-TimeZone).Id)"
          Write-Host "Region:   $((Get-WinHomeLocation).HomeLocation)"
          Write-Host "Culture:  $((Get-Culture).Name)"

      - name: Create RDP User with Random Password
        run: |
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper   | Get-Random -Count 4
          $rawPassword += $charSet.Lower   | Get-Random -Count 4
          $rawPassword += $charSet.Number  | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Connect to Tailscale
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $tsArgs = @(
            "up",
            "--authkey=${{ secrets.TAILSCALE_AUTH_KEY }}",
            "--hostname=gh-runner-$env:GITHUB_RUN_ID",
            "--unattended"
          )

          # Optional: route traffic through a Philippines exit node (repo secret PH_EXIT_NODE)
          $exitNode = "${{ secrets.PH_EXIT_NODE }}"
          if ($exitNode) {
              $tsArgs += "--exit-node=$exitNode"
              $tsArgs += "--exit-node-allow-lan-access"
          }

          & $ts @tsArgs

          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $ts ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP was not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Keep Session Alive
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "==================`n"

          while ($true) {
              Write-Host "[$(Get-Date)] RDP active"
              Start-Sleep -Seconds 300
          }
